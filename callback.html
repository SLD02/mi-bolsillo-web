<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b3d">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/callback.css">
  <script src="/callback.js" defer></script>
  <title>Continuar en Mi Bolsillo</title>
</head>
<body>
  <main class="page">
    <section class="panel" aria-live="polite" aria-atomic="true">
      <img class="logo" src="/assets/favicon.svg" width="76" height="76" alt="Ícono de Mi Bolsillo">
      <div class="brand">MI BOLSILLO <span>· LAKE'S STUDIO</span></div>
      <div class="icon-check" id="status-icon" aria-hidden="true">✓</div>
      <h1 id="title">Verificando tu acceso…</h1>
      <p id="message">Estamos preparando tu regreso a Mi Bolsillo.</p>
      <a id="open-app" class="action" hidden>Volver a Mi Bolsillo <span aria-hidden="true">↗</span></a>
      <p class="help" id="help">Si tu teléfono pregunta si deseas abrir Mi Bolsillo, selecciona «Abrir».</p>
      <p class="footnote">Tus finanzas, a tu manera.</p>
    </section>
  </main>
</body>
</html>
