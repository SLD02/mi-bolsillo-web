name: Verificar callback OAuth web
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar sintaxis JavaScript
        run: node --check callback.js
      - name: Ejecutar pruebas de callback
        run: node --test tests/callback.test.cjs
